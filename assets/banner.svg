<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-label="Axari gradient">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F3B7C4"/>
      <stop offset="0.5" stop-color="#D4C4F3"/>
      <stop offset="1" stop-color="#8FCFE3"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="m"><rect width="1200" height="120" fill="url(#fade)"/></mask>
    <filter id="blur" x="-10%" y="-100%" width="120%" height="300%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <g mask="url(#m)" opacity="0.55">
    <ellipse cx="300" cy="70" rx="300" ry="34" fill="#F3B7C4" filter="url(#blur)"/>
    <ellipse cx="600" cy="74" rx="320" ry="34" fill="#D4C4F3" filter="url(#blur)"/>
    <ellipse cx="900" cy="70" rx="300" ry="34" fill="#8FCFE3" filter="url(#blur)"/>
  </g>
  <rect x="0" y="104" width="1200" height="4" rx="2" fill="url(#g)"/>
</svg>
